# Production — single FastAPI serves API + built UI
# Usage: docker compose -f docker-compose.prod.yml up --build -d
# Refresh UI on main first: ./scripts/release-prod.sh
#
# DB: external postgres_aidev_db on host :5432.
# App port: host 8013 → container 9000 (daily URL preserved).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: 9router-backend
    restart: unless-stopped
    ports:
      - "8013:9000"
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: "postgresql+asyncpg://dev_9route:dev_9route_pass@host.docker.internal:5432/db_9route"
