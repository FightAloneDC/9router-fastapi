services:
  db:
    image: postgres:16-alpine
    container_name: 9router-postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: 9router-backend
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - ./backend/.env
      - .env.docker
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    container_name: 9router-frontend
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pgdata:
